<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components</title>
    <style>
      div {
        border: solid 2px orange;
      }

      /* External styling of a Web Component as a whole */
      uc-tooltip {
        border: 1px solid blue;
        padding: 0.15rem;
      }
    </style>
    <script src="tooltip.js"></script>
    <script src="confirm-link.js"></script>
  </head>
  <body>
    <p>
      <uc-tooltip text="Web Components is a set of standards.">
        <span class="highlight">Web Components</span> </uc-tooltip
      >are awesome!
    </p>

    <uc-tooltip></uc-tooltip>

    <div>This does NOT get the Web Component's styles!</div>

    <a is="uc-confirm-link" href="http://www.google.com" target="_blank"
      >Google</a
    >
  </body>
</html>
